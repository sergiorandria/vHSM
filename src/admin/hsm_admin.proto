// hsm_admin.proto — gRPC management + signature query API (see PLAN.md §9).
//
// This is the first slice of the HsmAdmin service: the authentication entry
// point (AdminLogin).  The remaining RPCs (InitToken, QuerySignatures,
// StreamEvents, TestNotify, …) are added incrementally in later slices.
//
// Authentication model (see PLAN.md §9 & the security checklist):
//   * SO  (Security Officer) — CKU_SO
//   * USER                    — CKU_USER
//   AdminLogin validates the presented PIN against a slot's token.  On success
//   a session token is returned and an ADMIN_LOGIN (INFO) notification is
//   published.  Failed attempts feed the token's PIN lockout counter.

syntax = "proto3";

package vhsm.admin;

option java_package = "vhsm.admin";
option go_package = "vhsm/admin";

// Who is authenticating.
enum UserRole {
  USER = 0;  // CKU_USER
  SO   = 1;  // CKU_SO
}

// Request to authenticate an SO or USER against a slot's token.
message AdminLoginRequest {
  uint32 slot_id = 1;      // PKCS#11 slot id
  UserRole role = 2;       // which PIN is being verified
  string pin = 3;          // the PIN (wiped by the client after use)
  string caller = 4;       // optional: caller identity for audit context
}

message AdminLoginResponse {
  // Opaque session token to be presented on subsequent admin RPC calls.
  string session_token = 1;
  // Human-readable result (OK / PIN_INCORRECT / PIN_LOCKED / …).
  string status = 2;
}

// Request: encrypt the slot's token snapshot into a vault file.
message BackupTokenRequest {
  uint32 slot_id = 1;        // PKCS#11 slot id
  string vault_path = 2;     // vault file to create (must not already exist)
  string vault_password = 3; // password used to derive the vault key
}

message BackupTokenResponse {
  string status = 1;         // OK / ERROR:<reason>
}

// Request: restore a slot's token from a vault file.
message RestoreTokenRequest {
  uint32 slot_id = 1;        // PKCS#11 slot id
  string vault_path = 2;     // vault file to read
  string vault_password = 3; // password used to derive the vault key
}

message RestoreTokenResponse {
  string status = 1;         // OK / ERROR:<reason>
}

service HsmAdmin {
  rpc AdminLogin(AdminLoginRequest) returns (AdminLoginResponse);
  // Backup/Restore the token's durable state (KEK, flags, counters) into an
  // encrypted vault file (PLAN.md §8 BackupToken / RestoreToken).
  rpc BackupToken(BackupTokenRequest) returns (BackupTokenResponse);
  rpc RestoreToken(RestoreTokenRequest) returns (RestoreTokenResponse);
}