syntax = "proto3";

package testecho;

option cc_enable_arenas = true;

// Minimal echo service used to exercise GrpcConnection and status mapping.
service Echo {
    rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
    string message = 1;
    // When set, the server fails the RPC with this gRPC status code.
    int32 fail_status = 2;
}

message PingResponse {
    string message = 1;
}