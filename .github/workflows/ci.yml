name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev libcurl4-openssl-dev nlohmann-json3-dev libgtest-dev ninja-build
      - name: Configure (db backend)
        run: cmake --preset linux-ninja -DVHSM_STORE_BACKEND=db -DVHSM_LEDGER=OFF
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
          vcpkg install --triplet x64-windows sqlite3 openssl curl nlohmann-json gtest --x-manifest-root=.
        shell: pwsh
      - name: Configure (db backend, MSVC)
        run: cmake --preset windows-msvc -DVHSM_STORE_BACKEND=db
        shell: pwsh
      - name: Build
        run: cmake --build build -j4
        shell: pwsh
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
        shell: pwsh
      - name: Configure ledger backend
        run: cmake --preset windows-msvc -DVHSM_STORE_BACKEND=ledger -DVHSM_LEDGER=ON
        shell: pwsh
      - name: Build ledger
        run: cmake --build build -j4
        shell: pwsh
