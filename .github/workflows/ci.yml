name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev libcurl4-openssl-dev nlohmann-json3-dev libgtest-dev ninja-build
      - name: Configure (db backend)
        run: cmake --preset linux-ninja -DVHSM_STORE_BACKEND=db -DVHSM_LEDGER=OFF
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4


  asan:
    runs-on: ubuntu-latest
    # ASan + UBSan via the existing `asan` CMake preset. Catches memory
    # errors, leaks, and undefined behavior that the plain build misses.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev libcurl4-openssl-dev nlohmann-json3-dev libgtest-dev ninja-build
      - name: Configure (ASan + UBSan)
        run: cmake --preset asan -DVHSM_STORE_BACKEND=db -DVHSM_LEDGER=OFF -DVHSM_ADMIN_GRPC=OFF
      - name: Build (ASan)
        run: cmake --build build-asan -j4
      - name: Test (ASan)
        run: ctest --test-dir build-asan --output-on-failure -j4


  linux-ledger:
    runs-on: ubuntu-latest
    # Scaffolding for Fabric Deliver integration — requires Docker + fabric-samples.
    # The job verifies the ledger code compiles and that the DeliverClient
    # checkpoint/full-block paths link; a live Fabric network is optional
    # (skipped when Docker/fabric-samples are absent).
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev libcurl4-openssl-dev nlohmann-json3-dev libgtest-dev ninja-build protobuf-compiler libgrpc++-dev libabsl-dev
      - name: Configure (ledger backend)
        run: cmake --preset linux-ninja -DVHSM_STORE_BACKEND=db -DVHSM_LEDGER=ON
      - name: Build (ledger)
        run: cmake --build build -j4
      - name: Test (unit, ledger)
        run: ctest --test-dir build --output-on-failure -j4
      - name: Bench (smoke)
        run: |
          cmake -S . -B build-bench -G Ninja -DVHSM_ENABLE_BENCH=ON > /dev/null
          cmake --build build-bench --target vhsm_bench -j4
          ./build-bench/tests/bench/vhsm_bench > /tmp/bench.txt 2>&1 || cat /tmp/bench.txt
          grep -q "bench done" /tmp/bench.txt
      - name: TSan (smoke)
        run: |
          cmake -S . -B build-tsan -G Ninja -DVHSM_ENABLE_TSAN=ON -DCMAKE_BUILD_TYPE=Debug > /dev/null
          cmake --build build-tsan --target stress_tsan -j4
          ./build-tsan/tests/stress/stress_tsan

  integration-fabric:
    runs-on: ubuntu-latest
    # Full Fabric network integration — skipped until fabric-samples + Docker
    # are wired. The job is present so contributors see the intended
    # integration path; it currently only verifies the client links.
    if: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Start Fabric test network
        run: |
          git clone --depth 1 https://github.com/hyperledger/fabric-samples
          (cd fabric-samples/test-network && ./network.sh up createChannel -c mychannel -ca)
      - name: Run Fabric integration tests
        run: ctest --test-dir build -R integration --output-on-failure

  windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Setup vcpkg
        run: |
          $vcpkgRoot = "${{ github.workspace }}/vcpkg"
          if (-not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          }
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat")
        shell: pwsh
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Restore VCPKG_ROOT
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $env:GITHUB_ENV
        shell: pwsh
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
      - name: Configure (db backend, MSVC)
        run: cmake --preset windows-msvc -DVHSM_STORE_BACKEND=db
        shell: pwsh
      - name: Build
        run: cmake --build build -j4
        shell: pwsh
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
        shell: pwsh
      - name: Configure ledger backend
        run: cmake --preset windows-msvc -DVHSM_STORE_BACKEND=ledger -DVHSM_LEDGER=ON
        shell: pwsh
      - name: Build ledger
        run: cmake --build build -j4
        shell: pwsh
