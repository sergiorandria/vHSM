# Per-host deployment template for ONE org (TEMPLATE — fill <...> placeholders)
#
# Run this on Org1's own machine. It starts only Org1's peer (+ its Fabric-CA
# / PostgreSQL / OpenLDAP PKI layer) and binds crypto from a HOST directory
# (/etc/vhsmd/organizations) instead of a generated ./organizations. The
# orderer and other orgs run on their own hosts from their own copies of this
# template.
#
# Key multi-host differences vs ../docker/docker-compose.yaml:
#   * CORE_PEER_GOSSIP_EXTERNALENDPOINT = the PUBLIC address of this host
#   * container ports are published on the host's external interface
#   * TLS certs (fabric-ca + peer) must carry the public hostname as a SAN
#   * firewall must allow 7051/7052/7053 (and 7050 on the orderer host)

version: "3.8"

networks:
  fabric:
    name: fabric-org1

services:
  postgres.org1:
    image: postgres:15
    container_name: postgres.org1
    environment:
      POSTGRES_DB: ${ORG1_DB_NAME}
      POSTGRES_USER: ${ORG1_DB_USER}
      POSTGRES_PASSWORD: ${ORG1_DB_PASS}
    volumes:
      - org1-pgdata:/var/lib/postgresql/data
    networks:
      - fabric

  ldap.org1:
    image: osixia/openldap:1.5.0
    container_name: ldap.org1
    environment:
      LDAP_ORGANISATION: "Org1"
      LDAP_DOMAIN: "${ORG1_DOMAIN}"
      LDAP_ADMIN_PASSWORD: "${ORG1_LDAP_ADMIN_PASS}"
      LDAP_BASE_DN: "dc=${ORG1_DOMAIN_DOMAIN_PART},dc=${ORG1_DOMAIN_TLD_PART}"
    volumes:
      - ./fabric-ca/org1/ldap-bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - org1-ldapdata:/var/lib/ldap
      - org1-ldapconfig:/etc/ldap/slapd.d
    networks:
      - fabric

  ca.org1:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.org1
    command: sh -c 'fabric-ca-server start -c /etc/hyperledger/fabric-ca-server/fabric-ca-server-config.yaml'
    environment:
      FABRIC_CA_SERVER_HOME: /etc/hyperledger/fabric-ca-server
    volumes:
      - ./fabric-ca/org1/fabric-ca-server-config.yaml:/etc/hyperledger/fabric-ca-server/fabric-ca-server-config.yaml
      - org1-cadata:/etc/hyperledger/fabric-ca-server/msp
    networks:
      - fabric
    depends_on:
      - postgres.org1
      - ldap.org1

  peer0.org1:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.org1
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    environment:
      CORE_PEER_ID: peer0.${ORG1_DOMAIN}
      CORE_PEER_ADDRESS: peer0.${ORG1_DOMAIN}:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.${ORG1_DOMAIN}:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_PEER_TLS_ENABLED: true
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      ORDERER_CA: /etc/hyperledger/orderer/tls/ca.crt
      FABRIC_CFG_PATH: /etc/hyperledger/fabric
      # CRUCIAL for multi-host: advertise the PUBLIC address, not the container name
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.${ORG1_DOMAIN}:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: ${ORG1_PUBLIC_HOST}:7051
      CORE_PEER_GOSSIP_USELEADERELECTION: "true"
      CORE_PEER_GOSSIP_ORGLEADER: "false"
      CORE_LEDGER_STATE_STATEDATABASE: goleveldb
    volumes:
      # Crypto is mounted FROM THE HOST, not generated inside the container:
      - ${ORG1_CRYPTO_ROOT}/peerOrganizations/${ORG1_DOMAIN}/peers/peer0.${ORG1_DOMAIN}/msp:/etc/hyperledger/fabric/msp:ro
      - ${ORG1_CRYPTO_ROOT}/peerOrganizations/${ORG1_DOMAIN}/peers/peer0.${ORG1_DOMAIN}/tls:/etc/hyperledger/fabric/tls:ro
      - ${ORG1_CRYPTO_ROOT}/ordererOrganizations/${ORD_ORG_DOMAIN}/orderers/orderer.${ORD_ORG_DOMAIN}/tls:/etc/hyperledger/orderer/tls:ro
      - ${ORG1_CHANNEL_ARTIFACTS}:/var/hyperledger/orderer/channel-artifacts
      - org1-peerdata:/var/hyperledger/production
    ports:
      # Publish on the host's external interface so other hosts / clients reach it
      - "${ORG1_PEER_EXTERNAL_PORT}:7051"
      - "${ORG1_CHAINCODE_EXTERNAL_PORT}:7052"
    networks:
      - fabric
    depends_on:
      - ca.org1

volumes:
  org1-pgdata:
  org1-ldapdata:
  org1-ldapconfig:
  org1-cadata:
  org1-peerdata:
